name: Bug report
description: Something is not working as expected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: The app and version, e.g. moorings 1.4.0 or sheepdog 1.1.1.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Displays, related apps, and tool versions, if relevant.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
